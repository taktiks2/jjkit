name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Build golangci-lint with this job's Go so its build-Go matches go.mod's
      # `go` directive (a prebuilt binary built with an older Go exits 3).
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - run: $(go env GOPATH)/bin/golangci-lint run
